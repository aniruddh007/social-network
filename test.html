<!DOCTYPE html>
<html>

<head>
    <title>Image Upload with Hover Edit</title>
    <style>
        .image-container {
            position: relative;
            width: 200px;
            height: 200px;
            overflow: hidden;
            border: 1px solid #ccc;
            /* Added a border for better visibility */
        }

        #profile-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .edit-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .image-container:hover .edit-button {
            opacity: 1;
        }

        #file-upload {
            display: none;
            /* Hide the input element */
        }
    </style>
</head>

<body>

    <div class="image-container">
        <img src="default_image.jpg" alt="Profile Image" id="profile-image">
        <div class="edit-button">Edit</div>
        <input type="file" id="file-upload" accept="image/*">
    </div>

    <script>
        const image = document.getElementById('profile-image');
        const editButton = document.querySelector('.edit-button');
        const fileInput = document.getElementById('file-upload');

        editButton.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', () => {
            const file = fileInput.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    image.src = e.target.result;

                    // Simulate AJAX upload (replace with actual AJAX)
                    setTimeout(() => {
                        console.log("File uploaded (simulated):", file.name);
                        // In a real application, you'd send the file to the server here.
                    }, 500); // Simulate a 0.5-second delay
                }
                reader.readAsDataURL(file);
            }
        });

    </script>

</body>

</html>
